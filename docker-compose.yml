services:
  uco-postgres:
    image: postgis/postgis:16-3.4
    container_name: uco-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: uco
    ports:
      - '5433:5432'
    volumes:
      - uco_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d uco']
      interval: 5s
      timeout: 5s
      retries: 10

  uco-redis:
    image: redis:7.4-alpine
    container_name: uco-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - uco_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  uco_pgdata:
  uco_redisdata:
