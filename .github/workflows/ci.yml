name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: uco_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d uco_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/uco_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret
      ZALO_AUTH_MODE: mock
      GEO_MISMATCH_THRESHOLD_M: 500
      DELIVERY_VARIANCE_THRESHOLD_PCT: 0.02
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - run: pnpm prisma:migrate
      - run: pnpm db:seed
      - run: pnpm typecheck && pnpm lint && pnpm test && pnpm build
